[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warera"
version = "0.1.0"
description = "Python client for the WarEra game API (https://api2.warera.io)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/warera"]
